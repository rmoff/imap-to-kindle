# kindle-email configuration
# Copy to config.toml and fill in your values.
# IMPORTANT: chmod 600 config.toml — keep this file private, never commit it.
#
# Passwords / tokens can go directly in this file (recommended for local use),
# or be provided via environment variables to avoid storing them on disk at all:
#   KINDLE_EMAIL_IMAP_PASSWORD
#   KINDLE_EMAIL_SMTP_PASSWORD
#   KINDLE_EMAIL_RAINDROP_TOKEN
# Note: setting them on the command line (VAR=x cmd) leaks to shell history —
# use a .env file sourced with `set -a; source .env; set +a` if you prefer
# env vars over the config file.

[delivery]
# Where each rendered EPUB is delivered. One or more of:
#   "smtp" — Amazon Send-to-Kindle (needs [smtp] + [kindle] below)
#   "folder" — write into a directory (needs [folder] below), e.g. a Syncthing
#            folder that pushes it to a Kindle/KOReader, or an auto-import folder
#            another tool watches. (Formerly called "cwa"; that name still works.)
# A single string also works: target = "folder". Listing both delivers to both, and
# a run only counts as successful if every listed target succeeds.
# Sections for targets you don't list are ignored, so you can leave stale [smtp]
# credentials in place and flip back by editing this one line.
targets = ["folder"]

[imap]
host = "imap.gmail.com"
port = 993
username = "you@gmail.com"
password = "your-gmail-app-password"

[smtp]
host = "smtp.gmail.com"
port = 587
username = "you@gmail.com"
password = "your-gmail-app-password"

[kindle]
# Your Kindle's personal email address (Settings > Your Account > Send-to-Kindle Email)
address = "your_name@kindle.com"
# The address you send FROM — must be in your Kindle's Approved Personal Document Email List
from_address = "you@gmail.com"

# Only needed when "folder" is in delivery.targets. (Formerly [cwa] / ingest_dir.)
[folder]
# Directory the files are written into, AS SEEN INSIDE this container — bind-mount
# the real folder here in docker-compose.
dir = "/book-folder"
# Optional: a scratch dir for the temp file, which is then atomically renamed into
# dir so a watcher never sees a half-written file. It MUST be on the same
# filesystem as dir. In Docker, separate bind mounts are separate devices,
# so put staging INSIDE the same mount (e.g. a hidden sibling dir), NOT a second
# mount. If the rename would cross devices the sink falls back to a hidden temp
# inside dir automatically. Omit to always use that in-dir temp.
# staging_dir = "/book-folder/.staging"

[labels]
# Gmail label to watch for incoming newsletters
watch = "SendToKindle"
# Emails are moved here after successful delivery
processed = "SendToKindle/Processed"
# Emails are moved here if processing fails
failed = "SendToKindle/Failed"

[schedule]
# How often to check for new emails (seconds). 300 = every 5 minutes.
poll_interval_seconds = 300

[processing]
# Maximum image file size to download (KB)
max_image_size_kb = 500
# Maximum number of images per email
max_images_per_email = 20
# Set to false to skip all external images (faster, no network calls)
download_external_images = true
# Timeout for downloading each external image (seconds)
image_timeout_seconds = 10
# Optional: local FlareSolverr endpoint, used as a last-resort fetch fallback
# when both the direct fetch and r.jina.ai are blocked by a Cloudflare
# challenge (e.g. patreon.com). Omit to disable.
# flaresolverr_url = "http://host.docker.internal:8191"
# Restack two-column PDFs (academic papers) into single-column, screen-shaped
# pages. Other PDFs are always sent unchanged.
# pdf_relayout = true

# Optional: drain Raindrop.io bookmarks tagged for Kindle on each poll.
# Tag a bookmark #sendtokindle and the app will fetch, deliver, and add
# #sendtokindle_processed (or #sendtokindle_failed on failure) alongside it.
# The source tag is kept so it stays in Raindrop's tag suggestions.
# Get a test token at https://app.raindrop.io/settings/integrations.
# [raindrop]
# enabled = true
# token = "your-raindrop-test-token"
# source_tag = "sendtokindle"                # optional; default shown
# processed_tag = "sendtokindle_processed"   # optional; default shown
# failed_tag = "sendtokindle_failed"         # optional; default shown
