# Example only. Copy to a deployment directory alongside your config.toml and .env,
# then run `docker compose up -d` there. Not meant to be run from this repo.
services:
  kindle-email:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.toml:/app/config.toml:ro
    environment:
      - KINDLE_EMAIL_IMAP_PASSWORD
      - KINDLE_EMAIL_SMTP_PASSWORD
      - KINDLE_EMAIL_RAINDROP_TOKEN
      - KINDLE_EMAIL_TELEGRAM_TOKEN
      - KINDLE_EMAIL_TELEGRAM_CHAT_ID
